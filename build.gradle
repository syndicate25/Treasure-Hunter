buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://minecraftforge.net" }
    }
    dependencies {
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
}

apply plugin: 'forge'

sourceCompatibility = 1.8
targetCompatibility = 1.8

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

minecraft {
    version = mapping_version
    mappings = mapping_channel
}

compileJava {
    options.compilerArgs += [
            '-Xlint:all',
            '-Xlint:-path',
            '-Xlint:-processing',
            "-AreobfSrgFile=${project.file('build/srgs/mcp-srg.srg').getCanonicalPath()}"
    ]
    options.deprecation = true
    options.encoding = 'UTF-8'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
            '-Xlint:all',
            '-Xlint:-path',
            "-AreobfSrgFile=${tasks.reobf.srg}"
    ]
    options.deprecation = true
    options.encoding = 'utf8'
}

processResources {
    outputs.upToDateWhen { false }

    filesMatching('**/mcmod.info') {
        expand 'mod_id': mod_id,
                'mod_name': mod_name,
                'mod_description': mod_description,
                'minecraft_version': minecraft_version,
                'version': mod_version,
                'mod_authors': mod_authors
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_name}-Forge-${minecraft_version}-${mod_version}.jar"
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : mod_version,
                "Implementation-Title"    : mod_name,
                "Implementation-Version"  : mod_version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.register('copySrgs', Copy) {
    dependsOn 'genSrgs'
    from plugins.getPlugin("forge").delayedFile("{SRG_DIR}")
    include '**/*.srg'
    into 'build/srgs'
}

setupDecompWorkspace.dependsOn copySrgs
setupDevWorkspace.dependsOn copySrgs
compileJava.dependsOn copySrgs
